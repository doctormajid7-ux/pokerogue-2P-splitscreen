<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>PokéRogue — Solo</title>
    <link rel="stylesheet" href="./solo.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>PokéRogue</h1>
        <p class="subtitle">Mode solo</p>
      </header>

      <section aria-labelledby="profile-heading">
        <h2 id="profile-heading">Choisir une progression</h2>
        <p>Un profil 2 joueurs garde ici ses sauvegardes, Pokémon débloqués, œufs et progression.</p>
        <div id="profile-list" class="profile-list" aria-live="polite"></div>
        <p id="no-profiles" class="empty" hidden>Aucun profil 2 joueurs enregistré sur cet appareil.</p>
      </section>

      <div class="divider"><span>ou</span></div>

      <button id="solo-save" class="solo-save" type="button">
        Continuer avec la sauvegarde solo actuelle
      </button>
      <p class="hint">Cette sauvegarde reste distincte des profils 2 joueurs.</p>
    </main>
    <script type="module" src="./solo.js"></script>
  </body>
</html>
